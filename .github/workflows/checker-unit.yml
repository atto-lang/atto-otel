name: Telemetry checker unit tests (not guest execution)
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-record-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify pinned dependency SHA and shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[0-9a-f]{40}$' SOURCE_REF
          bash -n scripts/check.sh scripts/compiler.sh
          test -s tests/smoke.ores
          test -s src/otel.ores
      - name: Check standalone Rust JSONL verifier and negative records
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tools/telemetry-check/Cargo.toml
      - name: Explicit guest execution boundary
        shell: bash
        run: |
          echo 'Checker tests only. Oreslang smoke and int64 parity require building the exact private compiler SOURCE_REF and running scripts/check.sh.'
