name: Telemetry host contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path tools/compiler-admission/Cargo.toml -- --nocapture
      - run: cargo test --locked --manifest-path tools/telemetry-check/Cargo.toml
